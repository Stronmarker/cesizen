# Override PROD : backend (binaire compilé) + frontend (build statique via nginx).
# Usage : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#         (ou simplement `make prod`)
# Pas de bind mount du code : les images sont autonomes.
services:
  backend:
    build:
      context: ./backend
      target: prod
    image: cesizen/backend:prod
    container_name: cesizen_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cesizen}:${POSTGRES_PASSWORD:-cesizen}@db:5432/${POSTGRES_DB:-cesizen}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis en prod}
      PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      liquibase:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # URL API figée dans le bundle au build. Pour un vrai déploiement :
        # VITE_API_URL=https://api.cesizen.fr/api/v1
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    image: cesizen/frontend:prod
    container_name: cesizen_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
