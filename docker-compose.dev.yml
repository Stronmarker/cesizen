# Override DEV : backend (air hot-reload) + frontend (Vite dev server).
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#         (ou simplement `make dev`)
services:
  backend:
    build:
      context: ./backend
      target: dev
    container_name: cesizen_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cesizen}:${POSTGRES_PASSWORD:-cesizen}@db:5432/${POSTGRES_DB:-cesizen}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_please}
      PORT: 8080
      ALLOWED_ORIGINS: http://localhost:5173,capacitor://localhost,https://localhost
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_cache:/root/go/pkg/mod
    depends_on:
      liquibase:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: cesizen_frontend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - backend
