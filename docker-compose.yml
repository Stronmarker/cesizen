services:
  db:
    image: postgres:16-alpine
    container_name: cesizen_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cesizen}
      POSTGRES_USER: ${POSTGRES_USER:-cesizen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cesizen}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cesizen} -d ${POSTGRES_DB:-cesizen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: cesizen_migrations
    volumes:
      - ./db/changelog:/liquibase/changelog
    command: >
      --url=jdbc:postgresql://db:5432/${POSTGRES_DB:-cesizen}
      --username=${POSTGRES_USER:-cesizen}
      --password=${POSTGRES_PASSWORD:-cesizen}
      --changeLogFile=changelog/db.changelog-master.xml
      update
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: dev
    container_name: cesizen_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cesizen}:${POSTGRES_PASSWORD:-cesizen}@db:5432/${POSTGRES_DB:-cesizen}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_please}
      PORT: 8080
      ALLOWED_ORIGINS: http://localhost:5173,capacitor://localhost,https://localhost
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_cache:/root/go/pkg/mod
    depends_on:
      liquibase:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: cesizen_frontend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  go_cache:
  node_modules:
