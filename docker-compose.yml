# Base commune à tous les environnements.
# Ne s'utilise pas seule pour l'app : passer par un override.
#   make dev   → docker-compose.yml + docker-compose.dev.yml
#   make prod  → docker-compose.yml + docker-compose.prod.yml
# Les services backend/frontend sont définis dans ces overrides.
# db + liquibase sont communs. sonar/zap sont derrière des profiles.
services:
  db:
    image: postgres:16-alpine
    container_name: cesizen_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cesizen}
      POSTGRES_USER: ${POSTGRES_USER:-cesizen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cesizen}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cesizen} -d ${POSTGRES_DB:-cesizen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: cesizen_migrations
    volumes:
      - ./db/changelog:/liquibase/changelog
    command: >
      --url=jdbc:postgresql://db:5432/${POSTGRES_DB:-cesizen}
      --username=${POSTGRES_USER:-cesizen}
      --password=${POSTGRES_PASSWORD:-cesizen}
      --changeLogFile=changelog/db.changelog-master.xml
      update
    depends_on:
      db:
        condition: service_healthy

  # ── Qualité de code (SonarQube) ────────────────────────────────────────────
  # Ne démarre PAS avec `make dev/prod` (profile "sonar"). Gourmand en RAM (~2 Go).
  # Prérequis hôte Linux : sysctl -w vm.max_map_count=262144
  sonar-db:
    image: postgres:16-alpine
    container_name: cesizen_sonar_db
    profiles: ["sonar"]
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: cesizen_sonarqube
    profiles: ["sonar"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    ports:
      - "${SONAR_WEB_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      sonar-db:
        condition: service_healthy

  # Scanner one-shot : `make sonar-scan` (profile séparé, ne démarre jamais seul).
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: cesizen_sonar_scanner
    profiles: ["sonar-scan"]
    environment:
      SONAR_HOST_URL: ${SONAR_HOST_URL:-http://sonarqube:9000}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src
    working_dir: /usr/src

  # ── Sécurité DAST (OWASP ZAP) ──────────────────────────────────────────────
  # Scan dynamique de l'app EN COURS D'EXÉCUTION. Prérequis : `make dev` (ou prod).
  # Atteint les services par leur nom sur le réseau Docker (backend/frontend).
  # One-shot derrière le profile "zap" : `make zap-baseline` / `zap-api-scan`.
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: cesizen_zap
    profiles: ["zap"]
    volumes:
      - ./security/zap:/zap/wrk:rw
    working_dir: /zap/wrk

volumes:
  postgres_data:
  go_cache:
  node_modules:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
