server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Ne pas divulguer la version de nginx (ZAP 10036, OWASP A05).
    server_tokens off;

    # Compression
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── En-têtes de sécurité (OWASP A05 — Security Misconfiguration) ──────────
    # Appliqués à toutes les réponses. NB : un `add_header` dans un `location`
    # annulerait ceux-ci → /assets/ n'en définit aucun (uniquement `expires`).
    add_header X-Frame-Options            "DENY"                 always;  # anti-clickjacking (ZAP 10020)
    add_header X-Content-Type-Options     "nosniff"              always;  # anti MIME-sniffing (ZAP 10021)
    add_header Referrer-Policy            "no-referrer"          always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;  # ZAP 10063
    add_header Cross-Origin-Opener-Policy   "same-origin"        always;  # isolation (ZAP 90004)
    add_header Cross-Origin-Embedder-Policy "require-corp"       always;
    add_header Cross-Origin-Resource-Policy "same-origin"        always;  # ZAP 90004
    # CSP (ZAP 10038/10055) — durcit contre le XSS. connect-src autorise l'API.
    # Prod réel : remplacer http://localhost:8080 par https://api.cesizen.fr.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080 https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'" always;

    # SPA : toute route inconnue retombe sur index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets fingerprintés Vite → cache long.
    # Pas de `add_header` ici, sinon les en-têtes de sécurité ci-dessus ne seraient
    # pas hérités ; `expires` suffit à poser Cache-Control.
    location /assets/ {
        expires 1y;
    }
}
