# Configuration SonarQube — projet CESIZen
# Analyse : `make sonar-scan` (nécessite `make sonar-up` + SONAR_TOKEN dans .env)

sonar.projectKey=cesizen
sonar.projectName=CESIZen

# Sources analysées (backend Go + frontend React/TS)
sonar.sources=backend,frontend/src

# Tests
sonar.tests=backend
sonar.test.inclusions=**/*_test.go

# Exclusions (dépendances, builds, générés)
sonar.exclusions=\
  **/node_modules/**,\
  frontend/dist/**,\
  frontend/android/**,\
  frontend/ios/**,\
  **/*.gen.go,\
  db/**

# Encodage
sonar.sourceEncoding=UTF-8

# Go — le plugin lit les rapports de couverture si présents
# (générer avec : go test ./... -coverprofile=coverage.out)
sonar.go.coverage.reportPaths=backend/coverage.out
